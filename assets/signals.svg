<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400">
<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}

  .shape{transform-origin:220px 215px;transform:scale(0);animation:grow 1.2s cubic-bezier(.2,.9,.3,1.2) .3s forwards}
  @keyframes grow{to{transform:scale(1)}}
  .edge{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s ease .5s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .d{opacity:0;animation:pop .4s ease forwards,pulse 2.4s ease-in-out 2s infinite}
  @keyframes pop{to{opacity:1}}
  @keyframes pulse{50%{opacity:.4}}
  .sweep{transform-origin:220px 215px;animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0714"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff5fd2" stroke-opacity=".06"/></pattern>
<radialGradient id="fillg"><stop offset="0" stop-color="#ff5fd2" stop-opacity=".55"/><stop offset="1" stop-color="#b98cff" stop-opacity=".25"/></radialGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#7cf7ff" stop-opacity="0"/><stop offset="1" stop-color="#7cf7ff" stop-opacity=".35"/></linearGradient></defs>
<rect x="6" y="6" width="428" height="388" rx="14" fill="url(#bg)"/>
<rect x="6" y="6" width="428" height="388" rx="14" fill="url(#grid)"/>
<rect x="6" y="6" width="428" height="388" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.3" filter="url(#glow)"/>
<text x="28" y="38" class="mono" font-size="13" fill="#ff5fd2">// <tspan fill="#8b8fb8">yetkinlikler</tspan></text>
<polygon points="220.0,182.5 248.1,198.8 248.1,231.2 220.0,247.5 191.9,231.2 191.9,198.8" fill="none" stroke="#b98cff" stroke-opacity="0.16999999999999998"/><polygon points="220.0,150.0 276.3,182.5 276.3,247.5 220.0,280.0 163.7,247.5 163.7,182.5" fill="none" stroke="#b98cff" stroke-opacity="0.22"/><polygon points="220.0,117.5 304.4,166.2 304.4,263.8 220.0,312.5 135.6,263.8 135.6,166.2" fill="none" stroke="#b98cff" stroke-opacity="0.27"/><polygon points="220.0,85.0 332.6,150.0 332.6,280.0 220.0,345.0 107.4,280.0 107.4,150.0" fill="none" stroke="#b98cff" stroke-opacity="0.32"/><line x1="220" y1="215" x2="220.0" y2="85.0" stroke="#b98cff" stroke-opacity=".18"/><line x1="220" y1="215" x2="332.6" y2="150.0" stroke="#b98cff" stroke-opacity=".18"/><line x1="220" y1="215" x2="332.6" y2="280.0" stroke="#b98cff" stroke-opacity=".18"/><line x1="220" y1="215" x2="220.0" y2="345.0" stroke="#b98cff" stroke-opacity=".18"/><line x1="220" y1="215" x2="107.4" y2="280.0" stroke="#b98cff" stroke-opacity=".18"/><line x1="220" y1="215" x2="107.4" y2="150.0" stroke="#b98cff" stroke-opacity=".18"/>
<g class="sweep"><path d="M220,215 L350,215 A130,130 0 0,0 334.1,152.7 Z" fill="url(#sw)"/></g>
<polygon class="shape" points="220.0,98.0 315.7,159.8 315.7,270.2 220.0,312.5 146.8,257.2 163.7,182.5" fill="url(#fillg)"/>
<polygon class="edge" points="220.0,98.0 315.7,159.8 315.7,270.2 220.0,312.5 146.8,257.2 163.7,182.5" fill="none" stroke="#ff5fd2" stroke-width="2" filter="url(#glow)"/>
<circle cx="220.0" cy="98.0" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.20s"/><circle cx="315.7" cy="159.8" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.32s"/><circle cx="315.7" cy="270.2" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.44s"/><circle cx="220.0" cy="312.5" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.56s"/><circle cx="146.8" cy="257.2" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.68s"/><circle cx="163.7" cy="182.5" r="4" fill="#ff5fd2" class="d" style="animation-delay:1.80s"/><text x="220.0" y="63.0" text-anchor="middle" class="mono" font-size="12.5" fill="#f4f1ff">Backend</text><text x="345" y="141.0" text-anchor="start" class="mono" font-size="12.5" fill="#f4f1ff">Veritabanı</text><text x="345" y="297.0" text-anchor="start" class="mono" font-size="12.5" fill="#f4f1ff">API &amp; Yetki</text><text x="220.0" y="375.0" text-anchor="middle" class="mono" font-size="12.5" fill="#f4f1ff">Frontend</text><text x="95" y="297.0" text-anchor="end" class="mono" font-size="12.5" fill="#f4f1ff">Yapay Zekâ</text><text x="95" y="141.0" text-anchor="end" class="mono" font-size="12.5" fill="#f4f1ff">Mobil</text>
</svg>
