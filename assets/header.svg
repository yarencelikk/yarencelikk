<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
  .in{opacity:0;transform:translateY(10px);animation:in .8s ease forwards}
  .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
  @keyframes in{to{opacity:1;transform:none}}
  .flick{animation:flick 5s infinite 2s}
  @keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.6}92%{opacity:1}94%{opacity:.75}95%{opacity:1}}
  .bar{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.2s ease .7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .scan{animation:scan 7s linear infinite}
  @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(320px)}}
  .dot{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .orb{animation:float 8s ease-in-out infinite}
  @keyframes float{50%{transform:translate(-18px,12px)}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0714"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
  <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fd2" stop-opacity="0"/><stop offset="1" stop-color="#ff5fd2" stop-opacity=".07"/></linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#b98cff" stop-opacity=".35"/><stop offset="1" stop-color="#b98cff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff5fd2" stroke-opacity=".06"/></pattern>
  <clipPath id="win"><rect x="10" y="10" width="860" height="280" rx="14"/></clipPath>
  <linearGradient id="barg" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="308" y2="0"><stop offset="0" stop-color="#ff5fd2"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
</defs>
<rect x="10" y="10" width="860" height="280" rx="14" fill="url(#bg)"/>
<g clip-path="url(#win)">
  <rect x="10" y="10" width="860" height="280" fill="url(#grid)"/>
  <circle class="orb" cx="760" cy="90" r="190" fill="url(#orb)"/>
  <rect class="scan" x="10" y="0" width="860" height="60" fill="url(#sc)"/>
</g>
<rect x="10" y="10" width="860" height="280" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5" filter="url(#glow)"/>

<g class="in d1"><text x="48" y="74" class="mono" font-size="14" letter-spacing="3" fill="#ff5fd2">MERHABA, BEN</text></g>
<g class="in d2"><text x="46" y="130" class="mono flick" font-size="48" font-weight="700" fill="#f4f1ff">Emine Yaren Çelik</text></g>
<line class="bar" x1="48" y1="150" x2="308" y2="150" stroke="url(#barg)" stroke-width="3" stroke-linecap="round"/>
<g class="in d3">
  <text x="48" y="192" class="mono" font-size="20" fill="#b98cff">Backend Developer · Bilgisayar Mühendisi</text>
  <text x="48" y="220" class="mono" font-size="14.5" fill="#8b8fb8">Node.js · Express.js · PostgreSQL · React</text>
</g>
<g class="in d4">
  <rect x="48" y="240" width="226" height="30" rx="15" fill="#5fffb0" fill-opacity=".08" stroke="#5fffb0" stroke-opacity=".5"/>
  <circle class="dot" cx="66" cy="255" r="5" fill="#5fffb0"/>
  <text x="80" y="260" class="mono" font-size="13.5" fill="#5fffb0">İş fırsatlarına açığım</text>
</g>
</svg>
