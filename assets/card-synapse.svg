<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210">
<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}

  .b{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.8s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .f{opacity:0;animation:in .6s ease .6s forwards}
  @keyframes in{to{opacity:1}}
  .sh{animation:sh 3.5s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0714"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff5fd2" stroke-opacity=".06"/></pattern>
</defs>
<rect x="6" y="6" width="428" height="198" rx="14" fill="url(#bg)"/>
<rect x="6" y="6" width="428" height="198" rx="14" fill="url(#grid)"/>
<rect class="b" x="6" y="6" width="428" height="198" rx="14" fill="none" stroke="#b98cff" stroke-width="1.5" filter="url(#glow)"/>
<g class="f">
<text x="28" y="44" class="mono" font-size="12" fill="#b98cff">~/projects/<tspan fill="#8b8fb8">synapse</tspan></text>
<circle class="sh" cx="408" cy="40" r="5" fill="#b98cff" filter="url(#glow)"/>
<text x="28" y="80" class="mono" font-size="24" font-weight="700" fill="#f4f1ff">Synapse</text>
<text x="28" y="102" class="mono" font-size="13" fill="#b98cff">Kişiselleştirilmiş öğrenme ekosistemi</text>
<text x="28" y="128" class="mono" font-size="11.8" fill="#c9c6e0">PDF'leri yapay zekâ ile interaktif ders materyaline</text>
<text x="28" y="145" class="mono" font-size="11.8" fill="#c9c6e0">dönüştürür. İki kişilik ekip — frontend bendeydi.</text>
<rect x="28" y="160" width="54" height="24" rx="12" fill="#b98cff" fill-opacity=".12" stroke="#b98cff" stroke-opacity=".5"/><text x="55" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#b98cff">React</text><rect x="89.5" y="160" width="69" height="24" rx="12" fill="#b98cff" fill-opacity=".12" stroke="#b98cff" stroke-opacity=".5"/><text x="124" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#b98cff">Zustand</text><rect x="165.6" y="160" width="120" height="24" rx="12" fill="#b98cff" fill-opacity=".12" stroke="#b98cff" stroke-opacity=".5"/><text x="226" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#b98cff">TanStack Query</text><rect x="292.8" y="160" width="69" height="24" rx="12" fill="#b98cff" fill-opacity=".12" stroke="#b98cff" stroke-opacity=".5"/><text x="327" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#b98cff">FastAPI</text>
</g></svg>
