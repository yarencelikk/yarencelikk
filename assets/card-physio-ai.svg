<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210">
<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}

  .b{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.8s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .f{opacity:0;animation:in .6s ease .6s forwards}
  @keyframes in{to{opacity:1}}
  .sh{animation:sh 3.5s ease-in-out infinite}
  @keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0714"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff5fd2" stroke-opacity=".06"/></pattern>
</defs>
<rect x="6" y="6" width="428" height="198" rx="14" fill="url(#bg)"/>
<rect x="6" y="6" width="428" height="198" rx="14" fill="url(#grid)"/>
<rect class="b" x="6" y="6" width="428" height="198" rx="14" fill="none" stroke="#7cf7ff" stroke-width="1.5" filter="url(#glow)"/>
<g class="f">
<text x="28" y="44" class="mono" font-size="12" fill="#7cf7ff">~/projects/<tspan fill="#8b8fb8">physio-ai</tspan></text>
<circle class="sh" cx="408" cy="40" r="5" fill="#7cf7ff" filter="url(#glow)"/>
<text x="28" y="80" class="mono" font-size="24" font-weight="700" fill="#f4f1ff">PhysioAI</text>
<text x="28" y="102" class="mono" font-size="13" fill="#7cf7ff">Yapay zekâ destekli dijital rehabilitasyon</text>
<text x="28" y="128" class="mono" font-size="11.8" fill="#c9c6e0">Kameradan fizyoterapi egzersizi analizi: eklem</text>
<text x="28" y="145" class="mono" font-size="11.8" fill="#c9c6e0">açısı, tekrar sayımı, DTW skorlama. TÜBİTAK 2209-A.</text>
<rect x="28" y="160" width="69" height="24" rx="12" fill="#7cf7ff" fill-opacity=".12" stroke="#7cf7ff" stroke-opacity=".5"/><text x="63" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#7cf7ff">FastAPI</text><rect x="104.1" y="160" width="91" height="24" rx="12" fill="#7cf7ff" fill-opacity=".12" stroke="#7cf7ff" stroke-opacity=".5"/><text x="150" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#7cf7ff">PostgreSQL</text><rect x="202.1" y="160" width="84" height="24" rx="12" fill="#7cf7ff" fill-opacity=".12" stroke="#7cf7ff" stroke-opacity=".5"/><text x="244" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#7cf7ff">MediaPipe</text><rect x="292.8" y="160" width="40" height="24" rx="12" fill="#7cf7ff" fill-opacity=".12" stroke="#7cf7ff" stroke-opacity=".5"/><text x="313" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#7cf7ff">DTW</text><rect x="339.7" y="160" width="54" height="24" rx="12" fill="#7cf7ff" fill-opacity=".12" stroke="#7cf7ff" stroke-opacity=".5"/><text x="367" y="176" text-anchor="middle" class="mono" font-size="11.5" fill="#7cf7ff">React</text>
</g></svg>
