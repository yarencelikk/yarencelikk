<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400">
<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}

  .rail{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.2s ease .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .it{opacity:0;transform:translateX(-8px);animation:in .5s ease forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out 2.5s infinite}
  @keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3);opacity:0}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0714"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff5fd2"/><stop offset=".5" stop-color="#b98cff"/><stop offset="1" stop-color="#7cf7ff"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff5fd2" stroke-opacity=".06"/></pattern>
</defs>
<rect x="6" y="6" width="428" height="388" rx="14" fill="url(#bg)"/>
<rect x="6" y="6" width="428" height="388" rx="14" fill="url(#grid)"/>
<rect x="6" y="6" width="428" height="388" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.3" filter="url(#glow)"/>
<text x="28" y="38" class="mono" font-size="13" fill="#ff5fd2">// <tspan fill="#8b8fb8">zaman çizelgesi</tspan></text>
<line x1="44" y1="78" x2="44" y2="338" stroke="#b98cff" stroke-opacity=".25" stroke-width="2"/><line class="rail" x1="44" y1="78" x2="44" y2="338" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/><g class="it" style="animation-delay:0.30s">
<circle cx="44" cy="78" r="6" fill="#0a0714" stroke="#8b8fb8" stroke-width="2"/>
<text x="66" y="74" class="mono" font-size="11.5" fill="#8b8fb8">2016–20</text>
<text x="66" y="92" class="mono" font-size="13.5" fill="#f4f1ff">Bafra Fen Lisesi</text></g><g class="it" style="animation-delay:0.65s">
<circle cx="44" cy="130" r="6" fill="#0a0714" stroke="#b98cff" stroke-width="2"/>
<text x="66" y="126" class="mono" font-size="11.5" fill="#b98cff">2022–26</text>
<text x="66" y="144" class="mono" font-size="13.5" fill="#f4f1ff">Bilgisayar Müh. (Lisans) · Bartın Üni.</text></g><g class="it" style="animation-delay:1.00s">
<circle cx="44" cy="182" r="6" fill="#0a0714" stroke="#7cf7ff" stroke-width="2"/>
<text x="66" y="178" class="mono" font-size="11.5" fill="#7cf7ff">araştırma</text>
<text x="66" y="196" class="mono" font-size="13.5" fill="#f4f1ff">PhysioAI · TÜBİTAK 2209-A kabul</text></g><g class="it" style="animation-delay:1.35s">
<circle cx="44" cy="234" r="6" fill="#0a0714" stroke="#ff5fd2" stroke-width="2"/>
<text x="66" y="230" class="mono" font-size="11.5" fill="#ff5fd2">02–05.2026</text>
<text x="66" y="248" class="mono" font-size="13.5" fill="#f4f1ff">Uzun Dönem Stajyer · Atakum Belediyesi</text></g><g class="it" style="animation-delay:1.70s">
<circle cx="44" cy="286" r="6" fill="#0a0714" stroke="#b98cff" stroke-width="2"/>
<text x="66" y="282" class="mono" font-size="11.5" fill="#b98cff">06.2026</text>
<text x="66" y="300" class="mono" font-size="13.5" fill="#f4f1ff">Mezuniyet · GNO 3,35 / 4,00</text></g><g class="it" style="animation-delay:2.05s">
<circle cx="44" cy="338" r="6" fill="#0a0714" stroke="#5fffb0" stroke-width="2"/><circle cx="44" cy="338" r="6" fill="none" stroke="#5fffb0" class="ring"/>
<text x="66" y="334" class="mono" font-size="11.5" fill="#5fffb0">şimdi</text>
<text x="66" y="352" class="mono" font-size="13.5" fill="#f4f1ff">Backend pozisyonlarına açığım ▸</text></g>
</svg>